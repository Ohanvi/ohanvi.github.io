site_name: Ohanvi Help Center
site_description: Step-by-step documentation for Ohanvi WhatsApp Marketing API, social posting, email marketing, workflows, and advertisements.
site_url: https://docs.ohanvi.com/

theme:
  name: material
  logo: https://ohanvi.com/brand/ohanvi-icon-purple-32.webp
  favicon: https://ohanvi.com/brand/ohanvi-icon-purple-32.webp
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    scheme: default
    primary: deep purple
    accent: deep purple

plugins:
  - search
  # Click any image to open it full-screen (zoom, swipe between images, Esc to close).
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      skip_classes:
        - no-lightbox

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

