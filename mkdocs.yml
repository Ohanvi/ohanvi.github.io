site_name: Ohanvi Help Center
site_description: Step-by-step documentation for Ohanvi WhatsApp Marketing API, social posting, email marketing, workflows, and advertisements.
site_url: https://docs.ohanvi.com/

theme:
  name: material
  custom_dir: overrides
  logo: https://ohanvi.com/brand/ohanvi-icon-purple-32.webp
  favicon: https://ohanvi.com/brand/ohanvi-icon-purple-32.webp
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    scheme: default
    primary: deep purple
    accent: deep purple

plugins:
  - search:
      lang:
        - en
        - hi
  # English and Hindi. Docs keep one English file per page (page.md); a Hindi translation is
  # page.hi.md next to it. A page with no .hi.md yet shows the English text under /hi/, so the
  # language switcher never lands on a 404 while translation is in progress.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: hi
          name: हिन्दी
          build: true
          site_name: ओहानवी हेल्प सेंटर
